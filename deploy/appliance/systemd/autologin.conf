# Installed by install.sh as:
#   /etc/systemd/system/getty@tty1.service.d/autologin.conf
#
# Logs the kiosk user in automatically on tty1. logind then creates a real
# session + seat, which `cage` (wlroots) needs. The user's ~/.bash_profile
# hook execs `sd-kiosk-launch` on tty1.  __KIOSK_USER__ is substituted by
# install.sh.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin __KIOSK_USER__ --noclear %I $TERM
